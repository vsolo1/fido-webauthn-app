# Paste these lines INSIDE your existing <VirtualHost *:443> block in
# /etc/apache2/sites-available/homelab-ssl.conf
#
# Enable the modules first:
#   sudo a2enmod proxy proxy_http headers
#
# Apache keeps doing TLS. It forwards /fido/ to the Node app on loopback
# and tells the app the original request was HTTPS.

    RedirectMatch ^/fido$ /fido/
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On
    ProxyPass        /fido/ http://127.0.0.1:3000/
    ProxyPassReverse /fido/ http://127.0.0.1:3000/
